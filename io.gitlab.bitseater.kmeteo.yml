id: io.gitlab.bitseater.kmeteo
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: io.gitlab.bitseater.kmeteo

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher

build-options:
  env:
    # - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1
cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: krb5
    buildsystem: autotools
    subdir: src
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.2.tar.gz
        sha256: 3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13

  - python3-requirements.yaml
        
  - name: kmeteo
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.com/bitseater/kmeteo.git
        tag: 0.1.1
        commit: a6b4ed65a741c4085e4c25272a64817ccfdfb907
